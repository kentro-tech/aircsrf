[project]
name = "air-csrf"
version = "0.1.0"
description = "CSRF protection middleware for AIR/FastAPI applications using the double-submit cookie pattern"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Kentro Tech" }
]
keywords = ["csrf", "security", "fastapi", "starlette", "air", "middleware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Security",
]
dependencies = [
    "starlette>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "air>=0.1",
]

[project.urls]
Homepage = "https://github.com/kentro-tech/air-csrf"
Repository = "https://github.com/kentro-tech/air-csrf"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/air_csrf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
